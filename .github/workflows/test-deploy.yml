name: Test deployment

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Test build website
        run: npm run build
